services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: heatguard
      POSTGRES_PASSWORD: heatguard
      POSTGRES_DB: heatguard
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heatguard']
      interval: 5s
      retries: 10

volumes:
  pgdata:
